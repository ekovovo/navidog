[package]
name = "navidog-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MySQL, MariaDB, PostgreSQL, and SQLite drivers for navidog."

[dependencies]
navidog-core.workspace = true
navidog-util.workspace = true
gpui-kit.workspace = true
rust-i18n.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# rustls backend: client certificates are PEM (native-tls only accepts PKCS#12)
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "column_decltype", "column_metadata"] }
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
