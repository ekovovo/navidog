[package]
name = "navidog-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Design tokens, theme, and shared widgets for navidog."

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
rust-i18n.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Without a tree-sitter feature gpui-component uses a highlighter stub that ignores `editor.*` theme keys
gpui-kit = { workspace = true, features = ["test-support", "tree-sitter-sql"] }
