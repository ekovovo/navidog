[package]
name = "navidog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Database client for macOS."

[dependencies]
gpui-kit.workspace = true
rust-i18n.workspace = true
navidog-ui.workspace = true
navidog-core.workspace = true
navidog-db.workspace = true
navidog-plugin.workspace = true
navidog-connection.workspace = true
navidog-navigator.workspace = true
navidog-grid.workspace = true
navidog-query.workspace = true
navidog-util.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

# Needs Metal, so `cargo test` skips it. Run `cargo test -p navidog --test snapshot` by hand.
[[test]]
name = "snapshot"
harness = false
test = false
