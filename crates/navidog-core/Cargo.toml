[package]
name = "navidog-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Domain model, settings, encrypted storage, and cross-feature actions for navidog."

[dependencies]
gpui-kit.workspace = true
rust-i18n.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chacha20poly1305 = "0.10"
argon2 = "0.5"
base64 = "0.22"

# macOS Keychain and Windows Credential Manager. Linux keeps the machine key
# in a 0600 file (see `crypto::machine_key`); secret-service is not linked.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
