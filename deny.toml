[advisories]
yanked = "warn"

# Only unmaintained advisories about crates we depend on directly fail the check.
# The unmaintained crates in this tree (`chrono`, `instant`, `paste`, `proc-macro-error2`,
# `rustls-pemfile`, `rustybuzz`, `ttf-parser`) are pulled in by gpui-kit 0.8.0,
# mysql_async and usvg, or are our own direct dependencies awaiting a migration; none of
# them can be simply bumped here.
unmaintained = "workspace"

ignore = [
    # No patched release exists (`patched = []` in the advisory). The timing side
    # channel needs a remote attacker observing RSA *signing*; navidog only uses
    # `rsa` through russh for local SSH keys. Mirrored in `.cargo/audit.toml`.
    { id = "RUSTSEC-2023-0071", reason = "rsa has no fixed release, not exploitable for local SSH keys" },
    # Unmaintained with no fixed release; the advisory recommends jiff. chrono is a
    # direct dependency of eight crates (dates, timestamps, formatting), so the
    # migration is its own task, not a lockfile bump. Mirrored in `.cargo/audit.toml`.
    { id = "RUSTSEC-2026-0543", reason = "chrono migration to jiff is tracked as a separate task" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
