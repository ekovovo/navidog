[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/navidog"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/xhofe/navidog"

[workspace.dependencies]
# `version` lets `cargo publish` rewrite the path to a crates.io requirement.
# Keep it equal to workspace.package.version.
navidog-ui = { version = "0.0.1", path = "crates/navidog-ui" }
navidog-core = { version = "0.0.1", path = "crates/navidog-core" }
navidog-util = { version = "0.0.1", path = "crates/navidog-util" }
navidog-db = { version = "0.0.1", path = "crates/navidog-db" }
navidog-plugin = { version = "0.0.1", path = "crates/navidog-plugin" }
navidog-connection = { version = "0.0.1", path = "crates/navidog-connection" }
navidog-navigator = { version = "0.0.1", path = "crates/navidog-navigator" }
navidog-grid = { version = "0.0.1", path = "crates/navidog-grid" }
navidog-designer = { version = "0.0.1", path = "crates/navidog-designer" }
navidog-query = { version = "0.0.1", path = "crates/navidog-query" }

gpui-kit = { version = "0.8", features = ["gpui-fast"] }
rust-i18n = "4"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"

# Recommended by the gpui-kit docs: optimize the rendering dependencies in debug builds so the UI stays smooth
[profile.dev.package.gpui-pre]
opt-level = 3
[profile.dev.package.gpui-component]
opt-level = 3
[profile.dev.package.gpui-base]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3

[profile.release]
codegen-units = 1
strip = "symbols"
lto = "fat"
opt-level = "s"
# panic = "abort"
# "s" for a smaller binary. The 2026-10-10 spike scrolled about 20% slower than opt-level 3
# (21-table-viewer.md §1); release keeps "s".
