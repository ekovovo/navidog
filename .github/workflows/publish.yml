name: Publish

on:
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  schedule:
    # Daily fallback at 18:00 UTC. A push to main publishes nightly immediately.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  # One publish at a time per ref. A newer push to main supersedes the build in
  # flight; tag, schedule, and manual runs queue instead so an upload is never
  # cut off halfway.
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: write

env:
  # Baked into the binary. A nightly build follows the pre-release channel.
  NAVIDOG_BUILD_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'nightly' || 'stable' }}
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0
  APP_NAME: Navidog

jobs:
  prepare_vars:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.date.outputs.date }}
      build_rfc3339: ${{ steps.date.outputs.rfc3339 }}
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
          echo "rfc3339=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Decide whether this run should build
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          should_build=true
          # A run queued behind another one may carry an older commit. Only the
          # push that matches main's head may publish a nightly, so a delayed
          # schedule or manual run cannot overwrite a newer build.
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" -q .object.sha 2>/dev/null || echo "")"
            if [ -n "$head_sha" ] && [ "$head_sha" != "$GITHUB_SHA" ]; then
              echo "main moved to $head_sha; skipping stale run for $GITHUB_SHA"
              should_build=false
            fi
          fi
          # The daily fallback skips when the last nightly already built this commit.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$should_build" = true ]; then
            nightly_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -q .object.sha 2>/dev/null || echo "")"
            if [ "$nightly_sha" = "$GITHUB_SHA" ]; then
              echo "nightly already built $GITHUB_SHA; skipping"
              should_build=false
            fi
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
      - name: Pre-create draft release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          ids="$(
            gh api --paginate "repos/${{ github.repository }}/releases" \
              -q ".[] | select(.tag_name == \"${tag}\") | .id" 2>/dev/null || true
          )"
          if [ -z "$ids" ]; then
            gh release create "$tag" --draft --title "$tag" --notes ""
          fi

  macos:
    needs: prepare_vars
    if: needs.prepare_vars.outputs.should_build == 'true'
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    env:
      NAVIDOG_BUILD_TIMESTAMP: ${{ needs.prepare_vars.outputs.build_rfc3339 }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the tag version into Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/stamp-release-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-build-${{ matrix.target }}
      - name: install tools
        run: |
          cargo install --locked cargo-bundle@0.11.0
          brew install create-dmg
      - name: signing inputs
        id: sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then echo "cert=true" >> "$GITHUB_OUTPUT"; else echo "cert=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$APPLE_ID" ]; then echo "apple=true" >> "$GITHUB_OUTPUT"; else echo "apple=false" >> "$GITHUB_OUTPUT"; fi
      - name: Import code-signing certificate
        if: steps.sign.outputs.cert == 'true'
        env:
          p12_certificate: ${{ secrets.MACOS_CERTIFICATE }}
          p12_password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          cert="$RUNNER_TEMP/certificate.p12"
          echo "$p12_certificate" | base64 --decode > "$cert"
          security import "$cert" -k "$KEYCHAIN_PATH" -P "$p12_password" -T /usr/bin/codesign
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          # Keep the login keychain. `-s` replaces the search list.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            line="${line#\"}"
            line="${line%\"}"
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing[@]}"
      - name: release
        run: cargo bundle --release -p navidog --target ${{ matrix.target }} --features mimalloc
      - name: sign app
        if: steps.sign.outputs.cert == 'true'
        env:
          CERT_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          APP="target/${{ matrix.target }}/release/bundle/osx/${{ env.APP_NAME }}.app"
          for attempt in 1 2 3 4 5; do
            if codesign --force --deep --verbose --options runtime --timestamp \
              --entitlements Entitlements.plist --sign "$CERT_NAME" "$APP"; then
              break
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep 15
          done
          if ! codesign -dvv "$APP" 2>&1 | grep -q "^Timestamp="; then
            echo "no secure timestamp embedded in the signature" >&2
            exit 1
          fi
          codesign --verify --deep --strict --all-architectures --verbose=2 "$APP"
      - name: ad-hoc sign app (no certificate)
        if: steps.sign.outputs.cert != 'true'
        run: ./scripts/sign-macos.sh "target/${{ matrix.target }}/release/bundle/osx/${{ env.APP_NAME }}.app"
      - name: smoke test (signed app must paint)
        timeout-minutes: 5
        env:
          NAVIDOG_SMOKE_TEST: "1"
          NAVIDOG_HOME: ${{ runner.temp }}/navidog-smoke
        run: ./target/${{ matrix.target }}/release/bundle/osx/${{ env.APP_NAME }}.app/Contents/MacOS/navidog
      - name: create dmg
        run: |
          mkdir -p release
          create-dmg \
            --volname "${{ env.APP_NAME }} Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "${{ env.APP_NAME }}.app" 200 190 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 600 185 \
            "release/${{ env.APP_NAME }}-${{ matrix.arch }}.dmg" \
            "target/${{ matrix.target }}/release/bundle/osx/${{ env.APP_NAME }}.app"
      - name: notarize dmg
        if: steps.sign.outputs.cert == 'true' && steps.sign.outputs.apple == 'true'
        env:
          AC_USERNAME: ${{ secrets.APPLE_ID }}
          AC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="release/${{ env.APP_NAME }}-${{ matrix.arch }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$AC_USERNAME" --password "$AC_PASSWORD" --team-id "$AC_TEAM_ID" --wait
      - name: wait for propagation
        if: steps.sign.outputs.cert == 'true' && steps.sign.outputs.apple == 'true'
        run: sleep 30
      - name: staple DMG
        if: steps.sign.outputs.cert == 'true' && steps.sign.outputs.apple == 'true'
        run: xcrun stapler staple "release/${{ env.APP_NAME }}-${{ matrix.arch }}.dmg"
      - name: checksum
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          mkdir -p meta
          DMG_NAME="release/${{ env.APP_NAME }}-${{ matrix.arch }}.dmg"
          NAME="$(basename "$DMG_NAME")"
          SHA="$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')"
          SIZE="$(stat -f%z "$DMG_NAME")"
          echo "macos ${{ matrix.arch }} dmg $NAME $SHA $SIZE" > "meta/macos-${{ matrix.arch }}.txt"
      - name: upload asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/upload_asset.sh "release/${{ env.APP_NAME }}-${{ matrix.arch }}.dmg"
      - name: upload checksum meta
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: meta-macos-${{ matrix.arch }}
          path: meta/macos-${{ matrix.arch }}.txt
      - name: stage installers for the nightly release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.arch }}
          path: release/${{ env.APP_NAME }}-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  windows:
    needs: prepare_vars
    if: needs.prepare_vars.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            arch: aarch64
    env:
      NAVIDOG_BUILD_TIMESTAMP: ${{ needs.prepare_vars.outputs.build_rfc3339 }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the tag version into Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: ./scripts/stamp-release-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.target }}-build
      - name: release
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        shell: pwsh
        run: |
          cargo install --locked cargo-wix@0.3.9
          cargo build --release -p navidog --target ${{ matrix.target }} --features mimalloc
          Copy-Item "target/${{ matrix.target }}/release/navidog.exe" ./navidog.exe
          # light.exe resolves Icon SourceFile from the process cwd, not the wxs directory.
          $env:NAVIDOG_ICON = (Resolve-Path "crates/navidog/icons/navidog.ico").Path
          cargo wix --nocapture --no-build -p navidog --target ${{ matrix.target }}
          $msi = @(
            "target/wix",
            "target/${{ matrix.target }}/wix"
          ) | ForEach-Object { Get-ChildItem $_ -Filter *.msi -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $msi) { throw "cargo-wix did not write an msi" }
          Copy-Item $msi.FullName ./navidog.msi
      - name: smoke test
        if: matrix.arch == 'x86_64'
        timeout-minutes: 3
        shell: pwsh
        env:
          NAVIDOG_SMOKE_TEST: "1"
          NAVIDOG_HOME: ${{ runner.temp }}/navidog-smoke
        run: |
          $p = Start-Process -FilePath .\navidog.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: package
        shell: pwsh
        run: |
          $zipName = "navidog-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path navidog.exe -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

          $msiName = "navidog-windows-${{ matrix.arch }}.msi"
          Copy-Item navidog.msi $msiName
          echo "MSI_NAME=$msiName" >> $env:GITHUB_ENV

          $msiZipName = "navidog-windows-${{ matrix.arch }}.msi.zip"
          Compress-Archive -Path navidog.msi -DestinationPath $msiZipName
          echo "MSI_ZIP_NAME=$msiZipName" >> $env:GITHUB_ENV
      - name: checksum
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path meta | Out-Null
          $rows = @(
            @{ name = "$env:ZIP_NAME"; kind = "zip" },
            @{ name = "$env:MSI_NAME"; kind = "msi" },
            @{ name = "$env:MSI_ZIP_NAME"; kind = "msizip" }
          )
          $lines = foreach ($r in $rows) {
            $sha = (Get-FileHash $r.name -Algorithm SHA256).Hash.ToLower()
            $size = (Get-Item $r.name).Length
            "windows ${{ matrix.arch }} $($r.kind) $($r.name) $sha $size"
          }
          Set-Content -Encoding ascii -Path "meta/windows-${{ matrix.arch }}.txt" -Value $lines
      - name: upload assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ./scripts/upload_asset.sh "./${{ env.ZIP_NAME }}"
          ./scripts/upload_asset.sh "./${{ env.MSI_NAME }}"
          ./scripts/upload_asset.sh "./${{ env.MSI_ZIP_NAME }}"
      - name: upload checksum meta
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: meta-windows-${{ matrix.arch }}
          path: meta/windows-${{ matrix.arch }}.txt
      - name: stage installers for the nightly release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.MSI_NAME }}
            ${{ env.MSI_ZIP_NAME }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  linux:
    needs: prepare_vars
    if: needs.prepare_vars.outputs.should_build == 'true'
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            appimagetool: appimagetool-x86_64.AppImage
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            appimagetool: appimagetool-aarch64.AppImage
    env:
      NAVIDOG_BUILD_TIMESTAMP: ${{ needs.prepare_vars.outputs.build_rfc3339 }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the tag version into Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/stamp-release-version.sh
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.target }}-build
      - name: install appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/${{ matrix.appimagetool }}" -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
      - name: release
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cargo install --locked cargo-deb@3.7.0 cargo-generate-rpm@0.21.0
          cargo build --release -p navidog --features mimalloc
          cargo deb -p navidog --no-build -o "./navidog-linux-${{ matrix.arch }}.deb"
          cargo generate-rpm -p crates/navidog -o "./navidog-linux-${{ matrix.arch }}.rpm"
          # cargo-appimage only accepts a Cargo.toml that is itself the
          # workspace root. This package inherits version and deps, and the
          # tool always opens ./Cargo.toml, which cargo_toml 0.22 cannot
          # walk up from. appimagetool is already on PATH.
          appdir="target/appimage/navidog.AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" target/appimage
          cp target/release/navidog "$appdir/usr/bin/navidog"
          cp crates/navidog/assets/navidog.desktop "$appdir/navidog.desktop"
          cp crates/navidog/icons/navidog.png "$appdir/navidog.png"
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/navidog" "$@"' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun" "$appdir/usr/bin/navidog"
          ARCH=${{ matrix.arch }} appimagetool "$appdir" target/appimage/navidog.AppImage
          mv target/release/navidog ./navidog
          chmod +x navidog
          objdump -p ./navidog | grep GLIBC
          tar -czvf "navidog-linux-${{ matrix.arch }}.tar.gz" navidog
          mv target/appimage/navidog.AppImage ./navidog.AppImage
          tar -czvf "navidog-${{ matrix.arch }}.AppImage.tar.gz" navidog.AppImage
      - name: smoke test (first frame must paint)
        continue-on-error: true
        timeout-minutes: 5
        env:
          NAVIDOG_SMOKE_TEST: "1"
          NAVIDOG_HOME: ${{ runner.temp }}/navidog-smoke
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
          xvfb-run -a ./navidog
      - name: checksum
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          mkdir -p meta
          : > "meta/linux-${{ matrix.arch }}.txt"
          for entry in \
            "navidog-linux-${{ matrix.arch }}.tar.gz tarball" \
            "navidog-${{ matrix.arch }}.AppImage.tar.gz appimage" \
            "navidog-linux-${{ matrix.arch }}.deb deb" \
            "navidog-linux-${{ matrix.arch }}.rpm rpm"; do
            set -- $entry
            f="$1"; kind="$2"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            size="$(stat -c%s "$f")"
            echo "linux ${{ matrix.arch }} $kind $f $sha $size" >> "meta/linux-${{ matrix.arch }}.txt"
          done
      - name: upload assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/upload_asset.sh "navidog-linux-${{ matrix.arch }}.deb"
          ./scripts/upload_asset.sh "navidog-linux-${{ matrix.arch }}.rpm"
          ./scripts/upload_asset.sh "navidog-linux-${{ matrix.arch }}.tar.gz"
          ./scripts/upload_asset.sh "navidog-${{ matrix.arch }}.AppImage.tar.gz"
      - name: upload checksum meta
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: meta-linux-${{ matrix.arch }}
          path: meta/linux-${{ matrix.arch }}.txt
      - name: stage installers for the nightly release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            navidog-linux-${{ matrix.arch }}.deb
            navidog-linux-${{ matrix.arch }}.rpm
            navidog-linux-${{ matrix.arch }}.tar.gz
            navidog-${{ matrix.arch }}.AppImage.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    needs: [prepare_vars, macos, windows, linux]
    if: needs.prepare_vars.outputs.should_build == 'true' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # changelogithub walks commits back to the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: meta-*
          path: meta
          merge-multiple: true
      - name: download nightly installers
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          pattern: "dist-*"
          path: dist
          merge-multiple: true
      - name: verify nightly installers
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          shopt -s nullglob
          meta_files=(meta/*.txt)
          test "${#meta_files[@]}" -gt 0
          # The metadata is the manifest: every entry must have arrived, and no
          # extra file may ride along, before the current nightly is touched.
          expected=0
          while read -r os arch kind name sha size; do
            test -f "dist/${name}" || { echo "missing installer: ${name}" >&2; exit 1; }
            expected=$((expected + 1))
          done < <(cat "${meta_files[@]}")
          actual=$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')
          echo "installers: expected ${expected}, found ${actual}"
          test "${expected}" -eq "${actual}"
      - name: replace the nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: nightly
        run: |
          set -euo pipefail
          tag=nightly
          # Deleting the release leaves the tag behind; drop both, including any
          # draft left by a canceled run. Recreating (instead of clobbering
          # assets) refreshes published_at, which is what clients compare.
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            -q ".[] | select(.tag_name == \"${tag}\") | .id" 2>/dev/null || true)
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" 2>/dev/null || true
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "Development Build (Nightly)" \
            --notes "Rolling build from the latest main branch. Build date: ${{ needs.prepare_vars.outputs.build_date }}"
          ./scripts/upload_asset.sh dist/*
      - name: build SHA256SUMS and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          # main builds attach assets to the nightly release, not a release named main.
          RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && 'nightly' || github.ref_name }}
          BUILD_DATE: ${{ needs.prepare_vars.outputs.build_date }}
          BUILD_RFC3339: ${{ needs.prepare_vars.outputs.build_rfc3339 }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [ "$TAG" = "nightly" ]; then VERSION="nightly"; else VERSION="${TAG#v}"; fi
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          shopt -s nullglob
          meta_files=(meta/*.txt)
          if [ ${#meta_files[@]} -eq 0 ]; then
            echo "no checksum metadata; not publishing"
            exit 1
          fi
          # --output writes the changelog and does not publish the release.
          # Nightly was recreated above; a tag release stays a draft until the
          # last step.
          if [ "$TAG" = "nightly" ]; then
            printf '%s\n' "Rolling build from the latest main branch. Build date: $BUILD_DATE" > notes.md
          else
            npx --yes changelogithub@15.0.5 --output notes.md
          fi
          gh release edit "$TAG" --notes-file notes.md
          cat "${meta_files[@]}" > all-meta.txt
          awk '{print $5"  "$4}' all-meta.txt | sort -k2 > SHA256SUMS
          items=""
          while read -r os arch kind name sha size; do
            [ -z "${name:-}" ] && continue
            item=$(printf '{"os":"%s","arch":"%s","kind":"%s","name":"%s","url":"%s/%s","sha256":"%s","size":%s}' \
              "$os" "$arch" "$kind" "$name" "$BASE" "$name" "$sha" "$size")
            if [ -z "$items" ]; then items="$item"; else items="$items,$item"; fi
          done < all-meta.txt
          printf '{"version":"%s","tag":"%s","notes":"https://github.com/%s/releases/tag/%s","assets":[%s]}' \
            "$VERSION" "$TAG" "$REPO" "$TAG" "$items" \
            | jq --rawfile body notes.md '. + {body: $body}' > latest.json
          ./scripts/upload_asset.sh ./SHA256SUMS
          # Keep the release being published in the index even while its tag is a
          # draft. Other drafts stay out.
          gh api "repos/${REPO}/releases?per_page=30" > releases.json
          jq -c --arg current "$TAG" --arg fallback "$BUILD_RFC3339" '
            [ .[] | select(.draft != true or .tag_name == $current)
              | {
                  tag: .tag_name,
                  version: (if .tag_name == "nightly" then "nightly" else (.tag_name | ltrimstr("v")) end),
                  prerelease: (if .tag_name == "nightly" then true else (.prerelease // false) end),
                  published_at: (if (.published_at // "") == "" and .tag_name == $current then $fallback else (.published_at // "") end),
                  body: (.body // "")
                }
            ]
            | sort_by(.published_at)
            | reverse
            | .[]
          ' releases.json > entries.jsonl
          mkdir -p index-work
          : > entries-with-assets.jsonl
          while IFS= read -r entry; do
            tag=$(jq -r '.tag' <<<"$entry")
            assets='[]'
            if [ "$tag" = "$TAG" ]; then
              assets=$(jq -c '.assets // []' latest.json)
            elif gh release download "$tag" --pattern latest.json --clobber --dir index-work >/dev/null 2>&1; then
              assets=$(jq -c '.assets // []' index-work/latest.json)
              rm -f index-work/latest.json
            fi
            jq -c --argjson assets "$assets" '. + {assets: $assets}' <<<"$entry" >> entries-with-assets.jsonl
          done < entries.jsonl
          jq -s '{releases: .}' entries-with-assets.jsonl > releases-index.json
          jq --slurpfile index releases-index.json '. + {releases: $index[0].releases}' latest.json > latest.indexed.json
          mv latest.indexed.json latest.json
          ./scripts/upload_asset.sh ./latest.json
          # Keep nightly's own version and assets; only refresh its release list.
          if [ "$TAG" != "nightly" ] && gh release view nightly >/dev/null 2>&1 \
            && gh release download nightly --pattern latest.json --clobber --dir index-work >/dev/null 2>&1; then
            jq --slurpfile index releases-index.json '. + {releases: $index[0].releases}' index-work/latest.json > index-work/patched.json
            mv index-work/patched.json index-work/latest.json
            RELEASE_TAG=nightly ./scripts/upload_asset.sh index-work/latest.json
          fi
          if [ "$TAG" != "nightly" ]; then
            gh release edit "$TAG" --draft=false
          fi
