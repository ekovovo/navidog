name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/**"
      - ".github/workflows/preview.yml"

concurrency:
  # One preview per pull request; a new push supersedes the previous build.
  # A cancelled run does not edit the comment. The run that replaced it owns
  # the update, and a late "cancelled" note would overwrite the new one.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0

jobs:
  comment:
    name: post preview comment
    # A draft is not ready to be tried. Fork pull requests get a read-only
    # token, so they keep the artifact on the run page and skip the comment.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: post building comment
        # A read-only token (Dependabot, fork settings) must not fail the build.
        # The script keeps the last successful build in this comment.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/preview-comment.sh building

  macos:
    name: macos-aarch64
    needs: comment
    # Runs after the preview comment is posted. A skipped comment (fork) or a
    # failed comment job still builds; cancellation does not.
    if: >-
      always() &&
      !cancelled() &&
      github.event.pull_request.draft == false &&
      (needs.comment.result == 'success' || needs.comment.result == 'skipped' || needs.comment.result == 'failure')
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      file: ${{ steps.checksum.outputs.file }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The build runs pull request code; keep the token out of .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # Same key and target as the release builds, so a pull request restores
          # the cache main already populated.
          key: macos-build-aarch64-apple-darwin
      - name: install tools
        run: |
          cargo install --locked cargo-bundle@0.11.0
          brew install create-dmg
      - name: bundle
        run: cargo bundle --release -p navidog --target aarch64-apple-darwin --features mimalloc
      - name: verify app icon
        run: ./scripts/check-macos-bundle-icon.sh "target/aarch64-apple-darwin/release/bundle/osx/Navidog.app"
      - name: sign app
        run: ./scripts/sign-macos.sh "target/aarch64-apple-darwin/release/bundle/osx/Navidog.app"
      - name: create dmg
        run: |
          mkdir -p dist
          create-dmg \
            --volname "Navidog Preview" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Navidog.app" 200 190 \
            --hide-extension "Navidog.app" \
            --app-drop-link 600 185 \
            "dist/Navidog-preview-macos-aarch64.dmg" \
            "target/aarch64-apple-darwin/release/bundle/osx/Navidog.app"
      - name: checksum
        id: checksum
        run: |
          dmg="dist/Navidog-preview-macos-aarch64.dmg"
          echo "file=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          # With `archive: false` the file name becomes the artifact name; the
          # tester downloads the DMG directly instead of a zip inside a zip.
          name: Navidog-preview-macos-aarch64
          path: dist/Navidog-preview-macos-aarch64.dmg
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: summary
        env:
          FILE: ${{ steps.checksum.outputs.file }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          {
            echo "## macOS preview build"
            echo
            echo "- Artifact: \`$FILE\` (expires in 7 days)"
            echo "- SHA-256: \`$SHA256\`"
            echo "- Built from $GITHUB_SHA."
            echo
            echo "The app is ad-hoc signed and not notarized. Open the DMG, move"
            echo "\`Navidog.app\` to \`~/Applications\`, then allow it in System Settings"
            echo "→ Privacy & Security → Open Anyway if macOS blocks the first launch."
          } >> "$GITHUB_STEP_SUMMARY"

  comment-result:
    name: update preview comment
    needs: [comment, macos]
    # `always` still runs after a failed build, so the comment does not stay on
    # "in progress". `cancelled` is excluded: this run lost the race to a newer
    # push, and that push's comment is the one to keep.
    if: >-
      always() &&
      !cancelled() &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.macos.result == 'success' || needs.macos.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: update preview comment
        # A read-only token (Dependabot, fork settings) must not fail the build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT: ${{ needs.macos.result == 'success' && needs.macos.outputs.file || '' }}
          SHA256: ${{ needs.macos.result == 'success' && needs.macos.outputs.sha256 || '' }}
        run: ./scripts/preview-comment.sh "${{ needs.macos.result }}"
